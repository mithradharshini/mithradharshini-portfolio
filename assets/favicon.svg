<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#FF2E97" />
      <stop offset="100%" stop-color="#FF8A3D" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#12062B" stroke="#00F0FF" stroke-width="2" />
  <!-- Retro Starbursts -->
  <path d="M12 16 L14 16 M13 15 L13 17" stroke="#FFD166" stroke-width="1.5" stroke-linecap="round" />
  <path d="M50 46 L54 46 M52 44 L52 48" stroke="#FFD166" stroke-width="1.5" stroke-linecap="round" />
  <!-- Rocket Body -->
  <g filter="url(#neonGlow)">
    <!-- Thrust Flames -->
    <path d="M26 44 L22 56 L32 50 L42 56 L38 44 Z" fill="#FF8A3D" />
    <path d="M28 44 L26 52 L32 47 L38 52 L36 44 Z" fill="#FFD166" />
    <!-- Fins -->
    <path d="M22 36 L16 44 L25 42 Z" fill="#FF2E97" />
    <path d="M42 36 L48 44 L39 42 Z" fill="#FF2E97" />
    <!-- Fuselage -->
    <path d="M32 10 C26 18 24 28 24 42 L40 42 C40 28 38 18 32 10 Z" fill="url(#rocketGrad)" />
    <!-- Porthole -->
    <circle cx="32" cy="24" r="4.5" fill="#12062B" stroke="#00F0FF" stroke-width="1.5" />
    <circle cx="31" cy="23" r="1.5" fill="#00F0FF" />
  </g>
</svg>
